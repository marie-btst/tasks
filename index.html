<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Triable & Emojis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="images/logo.ico" type="image/x-icon">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Bouton paramètres -->
        <button id="settings-btn" class="settings-btn" title="Paramètres" aria-label="Ouvrir les paramètres">
            ⚙️
        </button>

        <!-- Modal paramètres -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🎨 Personnalisation des couleurs</h2>
                    <button id="close-settings" class="close-btn" aria-label="Fermer">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="color-grid">
                        <div class="color-item">
                            <label for="bg-color">Fond de la page</label>
                            <input type="color" id="bg-color" data-var="--bg-color" value="#181818">
                        </div>
                        <div class="color-item">
                            <label for="card-bg">Fond des cartes</label>
                            <input type="color" id="card-bg" data-var="--card-bg" value="#292929">
                        </div>
                        <div class="color-item">
                            <label for="text-primary">Texte principal</label>
                            <input type="color" id="text-primary" data-var="--text-primary" value="#ffffff">
                        </div>
                        <div class="color-item">
                            <label for="text-secondary">Texte secondaire</label>
                            <input type="color" id="text-secondary" data-var="--text-secondary" value="#c4c4c4">
                        </div>
                        <div class="color-item">
                            <label for="accent">Accent</label>
                            <input type="color" id="accent" data-var="--accent" value="#e0e0e0">
                        </div>
                        <div class="color-item">
                            <label for="accent-hover">Accent hover</label>
                            <input type="color" id="accent-hover" data-var="--accent-hover" value="#a0a0a0">
                        </div>
                        <div class="color-item">
                            <label for="optional">Badge facultatif</label>
                            <input type="color" id="optional" data-var="--optional" value="#1ea319">
                        </div>
                        <div class="color-item">
                            <label for="danger">Danger</label>
                            <input type="color" id="danger" data-var="--danger" value="#d41e1e">
                        </div>
                        <div class="color-item">
                            <label for="border">Bordures</label>
                            <input type="color" id="border" data-var="--border" value="#696969">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button id="reset-colors" class="secondary-btn">Réinitialiser</button>
                        <button id="save-colors" class="primary-btn">Sauvegarder</button>
                    </div>
                </div>
            </div>
        </div>

        <header>
            <h1>📋 Mon Planning</h1>
            <p id="date-display"></p>
        </header>

        <div class="main-content">
            <!-- Section Tâches -->
            <section class="daily-section">
                <h2>Tâches du jour</h2>
                
                <div class="input-wrapper">
                    <div class="input-group">
                        <button id="emoji-trigger" class="emoji-btn" title="Emoji tâche" aria-label="Choisir un emoji">📌</button>
                        <input type="text" id="task-input" placeholder="Ajouter une tâche..." autocomplete="off" aria-label="Nouvelle tâche">
                        
                        <label class="checkbox-container">
                            <input type="checkbox" id="optional-check">
                            <span class="checkmark"></span>
                            Facultatif
                        </label>
                        
                        <button id="add-btn">Ajouter</button>
                    </div>

                    <div id="emoji-popover" class="hidden popover">
                        <emoji-picker class="dark"></emoji-picker>
                    </div>
                </div>

                <ul id="task-list"></ul>
                
                <button id="clear-all" class="danger-btn">Tout effacer</button>
            </section>

            <!-- Section Habitudes -->
            <section class="frequent-section">
                <h2>🔁 Habitudes</h2>
                
                <div class="input-wrapper">
                    <div class="input-group">
                        <button id="freq-emoji-trigger" class="emoji-btn" title="Emoji habitude" aria-label="Choisir un emoji">⭐</button>
                        <input type="text" id="frequent-input" placeholder="Nouvelle habitude..." aria-label="Nouvelle habitude">
                        <button id="add-frequent-btn">+</button>
                    </div>

                    <div id="freq-emoji-popover" class="hidden popover">
                        <emoji-picker class="dark" id="freq-picker"></emoji-picker>
                    </div>
                </div>
                
                <div id="frequent-list" class="tags-container"></div>
                <p class="small-text">Glisse pour trier • Clique pour ajouter</p>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
