<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="images/logo.ico">


    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>📋 Mon Planning</h1>
            <p id="date-display"></p>
        </header>

        <div class="main-content">
            <section class="daily-section">
                <h2>Tâches du jour</h2>
                
                <div class="input-wrapper">
                    <div class="input-group">
                        <button id="emoji-trigger" class="emoji-btn" title="Emoji tâche" aria-label="Choisir un emoji">📌</button>
                        <input type="text" id="task-input" placeholder="Ajouter une tâche..." autocomplete="off" aria-label="Nouvelle tâche">
                        
                        <label class="checkbox-container">
                            <input type="checkbox" id="optional-check">
                            <span class="checkmark"></span>
                            Facultatif
                        </label>
                        
                        <button id="add-btn">Ajouter</button>
                    </div>

                    <div id="emoji-popover" class="hidden popover">
                        <emoji-picker class="dark"></emoji-picker>
                    </div>
                </div>

                <ul id="task-list"></ul>
                
                <button id="clear-all" class="danger-btn">Tout effacer</button>
            </section>

            <section class="frequent-section">
                <h2>🔁 Habitudes</h2>
                
                <div class="input-wrapper">
                    <div class="input-group">
                        <button id="freq-emoji-trigger" class="emoji-btn" title="Emoji habitude" aria-label="Choisir un emoji">⭐</button>
                        <input type="text" id="frequent-input" placeholder="Nouvelle habitude..." aria-label="Nouvelle habitude">
                        <button id="add-frequent-btn">+</button>
                    </div>

                    <div id="freq-emoji-popover" class="hidden popover">
                        <emoji-picker class="dark" id="freq-picker"></emoji-picker>
                    </div>
                </div>
                
                <div id="frequent-list" class="tags-container"></div>
                <p class="small-text">Glisse pour trier • Clique pour ajouter</p>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
